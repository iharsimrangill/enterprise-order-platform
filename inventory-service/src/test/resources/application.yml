spring:
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false

app:
  kafka:
    topics:
      order-created: orders.created.v1
      inventory-reserved: inventory.reserved.v1
      inventory-rejected: inventory.rejected.v1
