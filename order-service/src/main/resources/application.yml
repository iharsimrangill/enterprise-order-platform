spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_platform}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${ORDER_INVENTORY_CONSUMER_GROUP:order-service-inventory-outcomes-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.portfolio.orders.messaging.event.InventoryOutcomeEvent
        spring.json.trusted.packages: com.portfolio.orders.messaging.event
    listener:
      ack-mode: record

app:
  cache:
    order-ttl-seconds: ${ORDER_CACHE_TTL_SECONDS:300}
  kafka:
    topics:
      order-created: ${ORDER_CREATED_TOPIC:orders.created.v1}
      inventory-reserved: ${INVENTORY_RESERVED_TOPIC:inventory.reserved.v1}
      inventory-rejected: ${INVENTORY_REJECTED_TOPIC:inventory.rejected.v1}

    recovery:
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
      max-retries: ${KAFKA_MAX_RETRIES:2}
      dlt-suffix: ${KAFKA_DLT_SUFFIX:.dlt}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
