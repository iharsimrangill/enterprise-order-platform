services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: order_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d order_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  inventory-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: inventory_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d inventory_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"

volumes:
  postgres-data:
  inventory-postgres-data:
